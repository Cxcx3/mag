name: Fix 360 scanner stability
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scanner patch
        run: |
          echo IyBub3QgYSBjb21tYW5k | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit scanner fix
        run: |
          if git diff --quiet -- tour-3d.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour-3d.js
          git commit -m "Stabilize wide-angle 360 scanner [scanner-fix]"
          git push
