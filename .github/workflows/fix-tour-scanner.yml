name: Fix 360 scanner stability
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tour-3d.js')
          s = p.read_text(encoding='utf-8')

          old = """  let _scanOrientHandler = null;
  let _scanRelSensor = null;
  let _scanGyroPrimed = false;
  let _lastRawYaw = null;"""
          new = """  let _scanOrientHandler = null;
  let _scanRelSensor = null;
  let _scanMotionHandler = null;
  let _scanGyroPrimed = false;
  let _lastRawYaw = null;
  let _scanIntegratedYaw = 0;
  let _scanIntegratedPitch = 0;
  let _scanLastMotionTime = 0;
  let _scanYawRateFiltered = 0;
  let _scanPitchRateFiltered = 0;"""
          if old not in s: raise SystemExit('sensor state marker not found')
          s=s.replace(old,new,1)

          start=s.index('  function stopScannerGyroListeners() {')
          end=s.index('  window.enableScannerGyroAim = async function () {',start)
          replacement="""  function stopScannerGyroListeners() {
    if (_scanOrientHandler) {
      window.removeEventListener('deviceorientation', _scanOrientHandler, true);
      window.removeEventListener('deviceorientation', _scanOrientHandler, false);
      _scanOrientHandler = null;
    }
    if (_scanMotionHandler) {
      window.removeEventListener('devicemotion', _scanMotionHandler, true);
      window.removeEventListener('devicemotion', _scanMotionHandler, false);
      _scanMotionHandler = null;
    }
    if (_scanRelSensor) {
      try { _scanRelSensor.stop(); } catch (e) {}
      _scanRelSensor = null;
    }
    _scanLastMotionTime = 0;
  }

  function setSensorPill(text, color) {
    var pill = document.getElementById('scanSensorModePill');
    if (!pill) return;
    pill.textContent = text;
    pill.style.color = color || '#FFD23F';
    pill.style.borderColor = color || '#FFD23F';
  }

  // Stable scanner aiming: use short-term gyro integration, not compass heading.
  // Indoor magnetometer readings can jump around metal, speakers and wiring.
  function applyGyroLook(yawDeg, pitchDeg) {
    if (scanIsDragging) return;
    if (!_scanGyroPrimed) {
      scanBaseYawOffset = yawDeg;
      scanSmoothYaw = 0;
      scanSmoothPitch = pitchDeg;
      scanCurrentYaw = 0;
      scanCurrentPitch = pitchDeg;
      _scanGyroPrimed = true;
      scanHasGyro = true;
      setSensorPill('📳 GYRO ACTIVE · STABLE', '#06D6A0');
      var btn = document.getElementById('scanEnableGyroBtn');
      if (btn) {
        btn.textContent = '✅ GYRO ACTIVE';
        btn.style.background = '#06D6A0';
        btn.style.color = '#0d1b1e';
      }
      return;
    }
    scanHasGyro = true;
    var targetYaw = normalizeAngle360(yawDeg);
    var dy = angleDiffSigned(targetYaw, scanSmoothYaw);
    if (Math.abs(dy) < 0.10) dy = 0;
    scanSmoothYaw = normalizeAngle360(scanSmoothYaw + dy * 0.22);
    var targetPitch = Math.max(-45, Math.min(45, pitchDeg));
    var dp = targetPitch - scanSmoothPitch;
    if (Math.abs(dp) < 0.08) dp = 0;
    scanSmoothPitch += dp * 0.22;
    scanCurrentYaw = scanSmoothYaw;
    scanCurrentPitch = scanSmoothPitch;
    if (scanIsSweeping) handleContinuousSweepProgress();
  }

  function startOrientationListeners() {
    stopScannerGyroListeners();
    _scanGyroPrimed = false;
    scanHasGyro = false;
    _scanIntegratedYaw = 0;
    _scanIntegratedPitch = 0;
    _scanLastMotionTime = 0;
    _scanYawRateFiltered = 0;
    _scanPitchRateFiltered = 0;

    _scanMotionHandler = function (e) {
      var rr = e && e.rotationRate;
      if (!rr) return;
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      if (!_scanLastMotionTime) {
        _scanLastMotionTime = now;
        setSensorPill('📳 MOTION READY · TURN SLOWLY', '#06D6A0');
        return;
      }
      var dt = Math.min(0.05, Math.max(0.001, (now - _scanLastMotionTime) / 1000));
      _scanLastMotionTime = now;
      var angle = (typeof screen !== 'undefined' && screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
      angle = ((angle % 360) + 360) % 360;
      var yawRate, pitchRate;
      if (angle === 90 || angle === 270) {
        yawRate = Number(rr.beta) || 0;
        pitchRate = Number(rr.gamma) || 0;
        if (angle === 270) yawRate *= -1;
      } else {
        yawRate = Number(rr.gamma) || 0;
        pitchRate = Number(rr.beta) || 0;
      }
      if (Math.abs(yawRate) < 0.35) yawRate = 0;
      if (Math.abs(pitchRate) < 0.35) pitchRate = 0;
      _scanYawRateFiltered += (yawRate - _scanYawRateFiltered) * 0.28;
      _scanPitchRateFiltered += (pitchRate - _scanPitchRateFiltered) * 0.28;
      _scanIntegratedYaw = normalizeAngle360(_scanIntegratedYaw + _scanYawRateFiltered * dt);
      _scanIntegratedPitch = Math.max(-45, Math.min(45, _scanIntegratedPitch + _scanPitchRateFiltered * dt));
      applyGyroLook(_scanIntegratedYaw, _scanIntegratedPitch);
    };
    window.addEventListener('devicemotion', _scanMotionHandler, true);
    setSensorPill('📳 MOTION READY · COMPASS OFF', '#06D6A0');
  }

"""
          s=s[:start]+replacement+s[end:]

          s=s.replace('      const hFov = 75;\n      const vFov = 50;', '      const hFov = 90;\n      const vFov = 59;', 1)
          s=s.replace('if (!slot.captured && angularDist < 8.5)', 'if (!slot.captured && angularDist < 6.0)', 1)
          s=s.replace('} else if (angularDist < 8.5) {', '} else if (angularDist < 6.0) {', 1)
          s=s.replace('}, 340);', '}, 450);', 1)
          s=s.replace('      var W = 2880;\n      var H = 1440;', '      var W = 3200;\n      var H = 1600;', 1)
          s=s.replace('        var maxDim = 1400;', '        var maxDim = 1920;', 1)

          oldf="""        // Optical FOV calculation based on frame aspect ratio
        var aspect = ww / wh;
        var diagFovRad = (76 * Math.PI) / 180;
        var tanHalfDiag = Math.tan(diagFovRad * 0.5);
        var tanHalfH = tanHalfDiag * (aspect / Math.sqrt(aspect * aspect + 1));
        var tanHalfV = tanHalfDiag * (1 / Math.sqrt(aspect * aspect + 1));
        var fovHDeg = 2 * Math.atan(tanHalfH) * (180 / Math.PI);
        var fovVDeg = 2 * Math.atan(tanHalfV) * (180 / Math.PI);"""
          newf="""        // Wide-camera rectilinear projection: match the wider capture mode.
        var aspect = ww / wh;
        var fovHDeg = 90;
        var tanHalfH = Math.tan((fovHDeg * Math.PI / 180) * 0.5);
        var fovVDeg = 2 * Math.atan(tanHalfH / aspect) * (180 / Math.PI);
        var tanHalfV = Math.tan((fovVDeg * Math.PI / 180) * 0.5);"""
          if oldf not in s: raise SystemExit('FOV block not found')
          s=s.replace(oldf,newf,1)
          s=s.replace('        var padH = fovHDeg * 0.58 + 4;\n        var padV = fovVDeg * 0.58 + 4;', '        var padH = fovHDeg * 0.54 + 3;\n        var padV = fovVDeg * 0.54 + 3;', 1)
          s=s.replace("canvas.toDataURL('image/jpeg', 0.94)", "canvas.toDataURL('image/jpeg', 0.96)", 1)
          s=s.replace("canvas.toBlob(res, 'image/jpeg', 0.94)", "canvas.toBlob(res, 'image/jpeg', 0.96)", 1)
          s=s.replace('Rotates seamlessly as you turn', 'LIVE COVERAGE · FINAL STITCH IS HD', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- tour-3d.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour-3d.js
          git commit -m "Stabilize wide-angle 360 scanner [scanner-fix]"
          git push
