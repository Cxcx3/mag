name: One-time SpotLIGHT page background patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'Cxcx3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch page background editor
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
            (
              "  .city-page{ background: var(--paper); }\n",
              """  .city-page{ background: var(--paper); }\n  /* Custom page background media — editor-controlled, city pages only */\n  .city-page .page-bg-media{\n    position:absolute;\n    inset:0;\n    z-index:0;\n    overflow:hidden;\n    pointer-events:none;\n    background:var(--paper);\n  }\n  .city-page .page-bg-media-content{\n    position:absolute !important;\n    inset:0 !important;\n    width:100% !important;\n    height:100% !important;\n    min-height:100% !important;\n    border-radius:0 !important;\n    background:transparent !important;\n  }\n  .city-page .page-bg-media-content img,\n  .city-page .page-bg-media-content video,\n  .city-page .page-bg-media-content iframe{\n    width:100% !important;\n    height:100% !important;\n    object-fit:cover !important;\n    display:block;\n  }\n  .city-page .sheet{\n    position:relative;\n    z-index:1;\n    background:transparent;\n  }\n"""
            ),
            (
              "        name: city.name || defaultCity.name || `City ${idx+1}`,\n        model,\n        ads\n",
              "        name: city.name || defaultCity.name || `City ${idx+1}`,\n        background: normalizeMedia(city.background, null),\n        model,\n        ads\n"
            ),
            (
              "  return {\n    id: 'city-' + cityNum,\n    cityIndex: idx,\n    cls: 'city-page ' + cityTheme,\n    html: `\n",
              "  return {\n    id: 'city-' + cityNum,\n    cityIndex: idx,\n    cls: 'city-page ' + cityTheme,\n    background: c.background || null,\n    html: `\n"
            ),
            (
              "          ${mediaFieldHTML('Featured Person Media (Photo or Video)', `city-${ci}-model`, c.model?.media, `model-${ci}-type`)}\n        </div>\n        <h4>Businesses</h4>",
              "          ${mediaFieldHTML('Featured Person Media (Photo or Video)', `city-${ci}-model`, c.model?.media, `model-${ci}-type`)}\n          ${mediaFieldHTML('Page Background (Photo or Video)', `city-${ci}-background`, c.background, `background-${ci}-type`)}\n        </div>\n        <h4>Businesses</h4>"
            ),
            (
              "      const cleanModel = sanitizeImageUrl(modelUrl);\n      c.model.media = cleanModel ? { type: modelType, url: cleanModel, poster: modelPoster || undefined } : null;\n      \n      document.querySelectorAll('.ad-editor[data-ai]').forEach(adEl => {",
              "      const cleanModel = sanitizeImageUrl(modelUrl);\n      c.model.media = cleanModel ? { type: modelType, url: cleanModel, poster: modelPoster || undefined } : null;\n\n      const bgInput = document.querySelector(`[data-media-url=\"city-${ci}-background\"]`);\n      const bgUrl = bgInput?.value.trim();\n      const bgPoster = bgInput?.dataset.poster?.trim();\n      const bgType = document.querySelector(`input[name=\"background-${ci}-type\"]:checked`)?.value || detectMediaType(bgUrl);\n      const cleanBg = sanitizeImageUrl(bgUrl);\n      c.background = cleanBg ? { type: bgType, url: cleanBg, poster: bgPoster || undefined } : null;\n      \n      document.querySelectorAll('.ad-editor[data-ai]').forEach(adEl => {"
            ),
            (
              "    pageEl.innerHTML = `\n      <div class=\"face front ${p.cls}\">\n        <div class=\"sheet\">",
              "    pageEl.innerHTML = `\n      <div class=\"face front ${p.cls}\">\n        ${p.background ? `<div class=\"page-bg-media\">${mediaBlock(p.background, '[ PAGE BACKGROUND ]', 'page-bg-media-content')}</div>` : ''}\n        <div class=\"sheet\">"
            )
          ]

          for old, new in replacements:
              if old not in s:
                  print('PATCH TARGET NOT FOUND:', repr(old[:100]))
                  sys.exit(1)
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          print('index.html patched successfully')
          PY

      - name: Remove one-time patch workflow
        run: rm -f .github/workflows/one-time-page-background.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-page-background.yml
          git commit -m "Add editable page background media" || exit 0
          git push
