name: One-time save performance fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-save-performance:
    if: ${{ !contains(github.event.head_commit.message, 'Apply save performance fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch tour save path
        shell: python
        run: |
          from pathlib import Path

          path = Path('tour-3d.js')
          text = path.read_text(encoding='utf-8')
          original = text

          old_cache = """      if (window.MAGAZINE) {\n        localStorage.setItem('spotlight_magazine_content_v5', JSON.stringify(window.MAGAZINE));\n      }\n"""
          new_cache = """      // Do not rewrite the entire magazine into localStorage on every 360 edit.\n      // The scoped tour cache above is enough for the tour itself.\n"""
          if old_cache in text:
              text = text.replace(old_cache, new_cache, 1)

          marker = "  // Auto-initialize UI on load\n"
          patch_marker = "  // SAVE PERFORMANCE PATCH v1\n"
          if patch_marker not in text:
              if marker not in text:
                  raise SystemExit('Could not find the tour engine initialization marker; no file was changed.')

              patch = r'''  // SAVE PERFORMANCE PATCH v1
  // Keep the live editor object unchanged, but persist only one canonical copy
  // of each 360 tour. Existing tour3d data remains fully compatible with the
  // loader above; redundant tourConfig/tourUrl copies are removed only from
  // the persistence payload.
  (function installSavePerformancePatch() {
    function compactMagazineForSave(data) {
      if (!data || typeof data !== 'object') return data;

      const payload = { ...data };
      if (Array.isArray(data.cities)) {
        payload.cities = data.cities.map(city => {
          if (!city || typeof city !== 'object') return city;
          const nextCity = { ...city };
          if (Array.isArray(city.ads)) {
            nextCity.ads = city.ads.map(ad => {
              if (!ad || typeof ad !== 'object') return ad;
              const nextAd = { ...ad };
              delete nextAd.tourConfig;
              delete nextAd.tourUrl;
              return nextAd;
            });
          }
          return nextCity;
        });
      }
      return payload;
    }

    function install() {
      const original = window.saveMagazineData;
      if (typeof original !== 'function' || original.__spotlightSavePerfPatch) return;

      let inFlight = null;
      let pendingPayload = null;

      const optimized = function (data) {
        const payload = compactMagazineForSave(data);

        // Serialize large saves. If several editor actions trigger saves at
        // once, keep only the newest pending snapshot instead of piling up
        // multiple Supabase writes.
        if (inFlight) {
          pendingPayload = payload;
          return inFlight;
        }

        const run = async () => {
          let current = payload;
          let result;
          do {
            pendingPayload = null;
            result = await original.call(this, current);
            current = pendingPayload;
          } while (current);
          return result;
        };

        inFlight = run().finally(() => {
          inFlight = null;
        });
        return inFlight;
      };

      optimized.__spotlightSavePerfPatch = true;
      optimized.__originalSaveMagazineData = original;
      window.saveMagazineData = optimized;
    }

    install();
    if (typeof window.saveMagazineData !== 'function' || !window.saveMagazineData.__spotlightSavePerfPatch) {
      let attempts = 0;
      const retry = setInterval(() => {
        install();
        attempts++;
        if (window.saveMagazineData?.__spotlightSavePerfPatch || attempts >= 40) {
          clearInterval(retry);
        }
      }, 100);
    }
  })();

'''
              text = text.replace(marker, patch + marker, 1)

          if text == original:
              raise SystemExit('Expected save code was not found; refusing to create a no-op commit.')

          path.write_text(text, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check tour-3d.js

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-save-performance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour-3d.js .github/workflows/one-time-save-performance-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply save performance fix"
          git push
