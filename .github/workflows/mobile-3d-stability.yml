name: Mobile 3D Stability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden mobile 3D switching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('tour-3d.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Cancel a queued requestAnimationFrame from an earlier hotspot click.
          anchor = '  let viewerSessionId = 0;\n  let miniSessionId = 0;'
          replacement = '  let viewerSessionId = 0;\n  let miniSessionId = 0;\n  let pending3dInitRaf = null;'
          if anchor in s and 'pending3dInitRaf' not in s:
              s = s.replace(anchor, replacement, 1)

          # 2) Abort the previous network/parse operation when a new model is selected.
          anchor = '  let sharedItemRenderer = null;\n  function getSharedItemRenderer(mountEl, width, height) {'
          replacement = '  let sharedItemRenderer = null;\n  let active3dLoadController = null;\n\n  function abortActive3dLoad() {\n    if (active3dLoadController) {\n      try { active3dLoadController.abort(); } catch (_) {}\n      active3dLoadController = null;\n    }\n  }\n\n  function getSharedItemRenderer(mountEl, width, height) {'
          if anchor in s and 'function abortActive3dLoad()' not in s:
              s = s.replace(anchor, replacement, 1)

          # 3) Make disposal abort an in-flight GLB fetch before freeing the model.
          anchor = '  function dispose3dViewer(viewerInstance, destroyRenderer = false) {\n    if (!viewerInstance) return;'
          replacement = '  function dispose3dViewer(viewerInstance, destroyRenderer = false) {\n    if (!viewerInstance) return;\n\n    if (viewerInstance.loadController) {\n      try { viewerInstance.loadController.abort(); } catch (_) {}\n      viewerInstance.loadController = null;\n    }'
          if anchor in s and 'viewerInstance.loadController' not in s:
              s = s.replace(anchor, replacement, 1)

          # 4) Replace only the remote GLTF loading section with an abortable fetch + parse.
          #    This prevents old GLB downloads/parses from continuing after a mobile user switches models.
          pattern = re.compile(
              r"    if \(isUrl && typeof THREE\\.GLTFLoader !== 'undefined'\) \{.*?\n    \} else \{\n      // Procedural models build and render on Frame 0 immediately \(< 3ms\)",
              re.S
          )
          new_loader = r'''    if (isUrl && typeof THREE.GLTFLoader !== 'undefined') {
      set3dLoading(true, 'Loading 3D asset...');
      const loader = new THREE.GLTFLoader();
      let dracoLoader = null;
      if (typeof THREE.DRACOLoader !== 'undefined') {
        try {
          dracoLoader = new THREE.DRACOLoader();
          dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
          loader.setDRACOLoader(dracoLoader);
        } catch (dracoErr) {
          console.warn('[SpotLIGHT 3D] DRACOLoader setup notice:', dracoErr);
          dracoLoader = null;
        }
      }

      const loadController = new AbortController();
      active3dLoadController = loadController;

      const finishLoad = () => {
        if (active3dLoadController === loadController) active3dLoadController = null;
        try { dracoLoader?.dispose?.(); } catch (_) {}
      };

      // Fetch first so switching models can actually abort the previous request.
      fetch(modelSrc, { signal: loadController.signal, credentials: 'omit', cache: 'force-cache' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.arrayBuffer();
        })
        .then((arrayBuffer) => {
          if (loadToken.cancelled || thisSession !== viewerSessionId || loadController.signal.aborted) return;
          let basePath = '';
          try {
            const absoluteUrl = new URL(modelSrc, window.location.href).href;
            basePath = absoluteUrl.slice(0, absoluteUrl.lastIndexOf('/') + 1);
          } catch (_) {}

          loader.parse(
            arrayBuffer,
            basePath,
            (gltf) => {
              if (loadToken.cancelled || thisSession !== viewerSessionId || loadController.signal.aborted) {
                try { disposeObject3DResources(gltf.scene); } catch (_) {}
                finishLoad();
                return;
              }

              const loadedMesh = gltf.scene;
              const box = new THREE.Box3().setFromObject(loadedMesh);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z) || 1;
              const scale = 2.4 / maxDim;
              loadedMesh.scale.setScalar(scale);
              const center = box.getCenter(new THREE.Vector3());
              loadedMesh.position.sub(center.multiplyScalar(scale));
              modelRoot.add(loadedMesh);

              try { renderer.render(scene, camera); } catch (_) {}
              set3dLoading(false);
              finishLoad();
            },
            (err) => {
              if (loadToken.cancelled || thisSession !== viewerSessionId || loadController.signal.aborted) {
                finishLoad();
                return;
              }
              console.warn('[SpotLIGHT 3D] GLTF parse failed, using procedural fallback:', err);
              set3dLoading(false);
              addFallback();
              finishLoad();
            }
          );
        })
        .catch((err) => {
          if (loadController.signal.aborted || loadToken.cancelled || thisSession !== viewerSessionId) {
            finishLoad();
            return;
          }
          console.warn('[SpotLIGHT 3D] 3D asset fetch failed, using procedural fallback:', err);
          set3dLoading(false);
          addFallback();
          finishLoad();
        });
    } else {
      // Procedural models build and render on Frame 0 immediately (< 3ms)'''
          s2, count = pattern.subn(new_loader, s, count=1)
          if count:
              s = s2

          # 5) Store the controller on the active viewer so normal disposal cancels it.
          anchor = '      animId: null,\n      cleanup: () => { loadToken.cancelled = true; }\n    };'
          replacement = '      animId: null,\n      loadController,\n      cleanup: () => {\n        loadToken.cancelled = true;\n        try { loadController.abort(); } catch (_) {}\n        if (active3dLoadController === loadController) active3dLoadController = null;\n      }\n    };'
          if anchor in s and 'loadController,\n      cleanup:' not in s:
              s = s.replace(anchor, replacement, 1)

          # 6) Prevent queued model initializers from racing each other when users tap hotspots quickly.
          old = '''          // Initialize 3D viewer on next frame once DOM layout and dimensions are active
          requestAnimationFrame(() => {
            init3dItemViewer(mount, modelSrc, true);
          });'''
          new = '''          // Only keep the newest queued model switch. Rapid mobile taps must not
          // create multiple viewers/loaders in consecutive animation frames.
          if (pending3dInitRaf) {
            cancelAnimationFrame(pending3dInitRaf);
            pending3dInitRaf = null;
          }
          pending3dInitRaf = requestAnimationFrame(() => {
            pending3dInitRaf = null;
            init3dItemViewer(mount, modelSrc, true);
          });'''
          if old in s:
              s = s.replace(old, new, 1)

          # 7) Cancel a queued initializer when the modal closes.
          old = '''  window.closeHotspotInfoModal = function () {
    const modal = document.getElementById('tourHotspotInfoModal');'''
          new = '''  window.closeHotspotInfoModal = function () {
    if (pending3dInitRaf) {
      cancelAnimationFrame(pending3dInitRaf);
      pending3dInitRaf = null;
    }
    abortActive3dLoad();
    const modal = document.getElementById('tourHotspotInfoModal');'''
          if old in s and 'abortActive3dLoad();' not in s[s.find(old):s.find(old)+500]:
              s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('No mobile 3D stability changes were applied; refusing to commit.')

          p.write_text(s, encoding='utf-8')
          print('Applied mobile 3D stability hardening.')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour-3d.js
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: abort stale mobile 3D model loads"
          git push
