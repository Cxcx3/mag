name: Apply SpotLIGHT 360 quality fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch true 2:1 360 rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tour-3d.js')
          s = p.read_text(encoding='utf-8')

          old = """        const ar = nw / nh;\n        \n        const isWidePano = (aspectMode === 'matterport-arc') || (aspectMode === 'iphone-pano') || (aspectMode === '360-loop') || (aspectMode !== 'full-360' && ar > 2.0);"""
          new = """        const ar = nw / nh;\n\n        // A true 2:1 equirectangular image is already a complete 360° master.\n        // Keep the original pixels intact instead of forcing it through the\n        // arc/crop/fill pipeline. This gives the sphere clean, natural\n        // perspective while preserving the existing Matterport-style UI.\n        const isTrueEquirectangular = ar >= 1.98 && ar <= 2.02;\n        const renderAspectMode = isTrueEquirectangular ? 'full-360' : aspectMode;\n        const isWidePano = !isTrueEquirectangular && (\n          renderAspectMode === 'matterport-arc' ||\n          renderAspectMode === 'iphone-pano' ||\n          renderAspectMode === '360-loop' ||\n          (renderAspectMode !== 'full-360' && ar > 2.0)\n        );"""
          if old not in s:
              raise SystemExit('Target rendering block not found; no changes made.')
          s = s.replace(old, new, 1)

          s = s.replace(
              "if (aspectMode === 'matterport-arc' || (isWidePano && aspectMode !== '360-loop' && aspectMode !== 'full-360')) {",
              "if (renderAspectMode === 'matterport-arc' || (isWidePano && renderAspectMode !== '360-loop' && renderAspectMode !== 'full-360')) {",
              1
          )
          s = s.replace(
              "} else if (aspectMode === '360-loop' || aspectMode === 'iphone-pano') {",
              "} else if (renderAspectMode === '360-loop' || renderAspectMode === 'iphone-pano') {",
              1
          )
          s = s.replace(
              "const isArcMode = (aspectMode === 'matterport-arc');",
              "const isArcMode = (renderAspectMode === 'matterport-arc');",
              1
          )

          old_tex = """        // Ultra-HD Crisp Texture Filtering Setup\n        finalTexture.generateMipmaps = true;\n        finalTexture.minFilter = THREE.LinearMipmapLinearFilter;\n        finalTexture.magFilter = THREE.LinearFilter;"""
          new_tex = """        // Ultra-HD Crisp Texture Filtering Setup\n        finalTexture.generateMipmaps = true;\n        finalTexture.minFilter = THREE.LinearMipmapLinearFilter;\n        finalTexture.magFilter = THREE.LinearFilter;\n        // Preserve the captured image's intended color/brightness on modern Three.js.\n        if ('colorSpace' in finalTexture && typeof THREE.SRGBColorSpace !== 'undefined') {\n          finalTexture.colorSpace = THREE.SRGBColorSpace;\n        }"""
          if old_tex not in s:
              raise SystemExit('Texture filtering block not found; no changes made.')
          s = s.replace(old_tex, new_tex, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only the targeted engine fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour-3d.js
          git rm .github/workflows/spotlight-360-quality-fix.yml
          git commit -m "Improve true 2:1 360 image rendering quality"
          git push
