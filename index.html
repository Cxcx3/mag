    aspect-ratio: 3 / 4.6;
    perspective:2400px;
  }
  .book{
    position:absolute; inset:0;
  }
  .page{

    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 0.85s cubic-bezier(.45,.05,.15,1);
    transform:rotateY(0deg);
    border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
  }
  .page.flipped{ transform:rotateY(-178deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .face.back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 14px),
      var(--paper);

  }

function cloneData(x){ return JSON.parse(JSON.stringify(x)); }
function sanitizeImageUrl(value){
  if (!value || typeof value !== 'string') return null;
  const trimmed = value.trim();
  if (!trimmed) return null;
  if (trimmed.startsWith('file://')) return null;
  if (trimmed.startsWith('C:/') || trimmed.startsWith('C:\\')) return null;
  return trimmed;
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (event) => resolve(event.target?.result || null);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
function bindUploadInputs(){
  document.querySelectorAll('input[type="file"][data-upload-target]').forEach((fileInput) => {
    if (fileInput.dataset.bound === 'true') return;
    fileInput.dataset.bound = 'true';

    const row = fileInput.closest('.upload-row');
    if (row && !row.querySelector('.upload-trigger')) {
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'upload-trigger';
      trigger.textContent = 'Add image from computer';
      trigger.addEventListener('click', () => fileInput.click());
      row.insertBefore(trigger, fileInput);
    }

    document.querySelectorAll('[data-open-file]').forEach((openBtn) => {
      const target = openBtn.dataset.openFile;
      if (target === fileInput.dataset.uploadTarget) {
        openBtn.onclick = () => fileInput.click();
      }
    });

    fileInput.addEventListener('change', async (event) => {
      const file = event.target?.files?.[0];
      if (!file) return;
      try {
        const dataUrl = await readFileAsDataURL(file);
        const targetName = fileInput.dataset.uploadTarget;
        const targetInput = document.querySelector(`[data-image-field="${targetName}"]`);
        if (targetInput) {
          targetInput.value = dataUrl || '';
          targetInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
      } catch (err) {
        console.error('Image upload failed', err);
        alert('Could not load this image. Please try another file.');
      }
      fileInput.value = '';
    });
  });
}

function attachUploadButton(targetName, buttonText = 'Add image from computer') {
  const fileInput = document.querySelector(`input[type="file"][data-upload-target="${targetName}"]`);
  if (!fileInput) return;
  const row = fileInput.closest('.upload-row');
  if (!row) return;
  if (row.querySelector('.upload-trigger')) return;
  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'upload-trigger';
  trigger.textContent = buttonText;
  trigger.addEventListener('click', () => fileInput.click());
  row.insertBefore(trigger, fileInput);
}
function normalizeMedia(media, fallback){
  if (media && typeof media === 'object' && media.url) {
    const clean = sanitizeImageUrl(media.url);
    if (clean) return { ...media, url: clean };
  }
  if (fallback && typeof fallback === 'object' && fallback.url) {
    const clean = sanitizeImageUrl(fallback.url);
    if (clean) return { ...fallback, url: clean };
  }
  return null;
}
function normalizeMagazine(saved){
  const base = cloneData(DEFAULT_MAGAZINE);
  if (!saved || typeof saved !== 'object') return base;

  const mergedCities = (saved.cities && Array.isArray(saved.cities) ? saved.cities : base.cities).map((city, idx) => {
    const fallbackCity = base.cities[idx] || base.cities[0];
    const model = {
      ...(fallbackCity?.model || {}),
      ...(city?.model || {})
    };
    model.media = normalizeMedia(city?.model?.media, fallbackCity?.model?.media);

    const ads = (city?.ads && Array.isArray(city.ads) ? city.ads : fallbackCity?.ads || []).map((ad, adIdx) => {
      const fallbackAd = (fallbackCity?.ads || [])[adIdx] || {};
      return {
        ...fallbackAd,
        ...(ad || {}),
        media: normalizeMedia(ad?.media, fallbackAd?.media)
      };
    });

    return {
      ...(fallbackCity || {}),
      ...(city || {}),
      model,
      ads
    };
  });

  const merged = {
    ...base,
    ...(saved || {}),
    cover: {
      ...base.cover,
      ...(saved.cover || {})
    },
    backCover: {
      ...base.backCover,
      ...(saved.backCover || {})
    },
    cities: mergedCities
  };

  merged.cover.coverPhotoUrl = sanitizeImageUrl(merged.cover.coverPhotoUrl) || base.cover.coverPhotoUrl;
  merged.cities.forEach((city, idx) => {
    const fallbackCity = base.cities[idx] || base.cities[0];
    if (!city.model || !city.model.media) city.model = { ...(fallbackCity.model || {}), ...(city.model || {}) };
    city.model.media = normalizeMedia(city.model?.media, fallbackCity.model?.media);
    city.ads = (city.ads || []).map((ad, adIdx) => {
      const fallbackAd = (fallbackCity.ads || [])[adIdx] || {};
      return {
        ...fallbackAd,
        ...(ad || {}),
        media: normalizeMedia(ad?.media, fallbackAd?.media)
      };
    });
  });

  return merged;
}

function getMagazine(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : null;
    let normalized = normalizeMagazine(parsed);
    // Safety net: if saved data got corrupted somehow and we ended up with
    // zero city pages, wipe it and fall back to the full default magazine
    // instead of leaving the reader stuck on a near-empty book.
    if (!normalized.cities || normalized.cities.length === 0) {
      localStorage.removeItem(STORAGE_KEY);
      normalized = cloneData(DEFAULT_MAGAZINE);
    }
    if (JSON.stringify(normalized) !== JSON.stringify(parsed || {})) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
    }
    return normalized;
  } catch(e) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
    return cloneData(DEFAULT_MAGAZINE);
  }
}

function resetMagazineContent(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  location.reload();
}

function mediaBlock(media, placeholderText, extraClass){
  const cls = 'media-box' + (extraClass ? ' '+extraClass : '');
  if(!media || !media.url){
    return `<div class="${cls} placeholder"><span>${placeholderText}</span></div>`;
  }
  if(media.type === 'video'){
    return `<div class="${cls}"><video src="${media.url}" autoplay muted loop playsinline></video></div>`;
  }
  return `<div class="${cls}"><img src="${media.url}" alt=""></div>`;
}

function standardAdHtml(a){

  `;
}

function renderPageContent(){
  bookEl.innerHTML='';
  dotsEl.innerHTML='';
  PAGES.forEach((p,idx)=>{const pageEl=document.createElement('div');pageEl.className='page';pageEl.id='page-'+idx;const html=typeof p.html==='function'?p.html():p.html;pageEl.innerHTML=`<div class="face front ${p.cls}"><div class="sheet">${html}</div></div><div class="face back"><div class="mark">Spotlight</div></div>`;bookEl.appendChild(pageEl);const dot=document.createElement('button');dot.className='dot';dot.title=p.id;dot.onclick=()=>{current=idx;render();};dotsEl.appendChild(dot);});

function render(){
  PAGES.forEach((p,idx)=>{const el=document.getElementById('page-'+idx);const flipped=idx<current;el.classList.toggle('flipped',flipped);el.style.zIndex=flipped?(idx+1):(total-idx+1);});
  [...dotsEl.children].forEach((d,idx)=>d.classList.toggle('active',idx===current));
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===total-1;
  pageCountEl.textContent=`Page ${current+1} of ${total}`;
}
function nextPage(){if(current<total-1){current++;render();}}
function prevPage(){if(current>0){current--;render();}}

// Run the first render immediately — don't wait on a browser timing event
// that may or may not still be pending by the time this script runs.
render();

let touchStartX=null;
const bookWrap=document.querySelector('.book-wrap');
if(bookWrap){
  bookWrap.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;});
  bookWrap.addEventListener('touchend',e=>{if(touchStartX===null)return;const dx=e.changedTouches[0].clientX-touchStartX;if(dx<-40)nextPage();if(dx>40)prevPage();touchStartX=null;});
}

/* ---- MOBILE SCROLL FIX ----
   iOS Safari has a known bug where native touch-drag-to-scroll doesn't
   work inside an element that's also being 3D-rotated (our page-flip
   effect). To work around it, we drive scrolling manually here instead
   of relying on the browser's built-in gesture. */
document.querySelectorAll('.sheet').forEach(sheet => {
  let startY = 0, startScroll = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startScroll = sheet.scrollTop;
    dragging = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if(!dragging) return;
    const dy = startY - e.touches[0].clientY;
    sheet.scrollTop = startScroll + dy;
  }, { passive: true });
  sheet.addEventListener('touchend', () => { dragging = false; });
});

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage();});

window.addEventListener('load',()=>{
  editorToggle.style.display = 'block';
});
</script>
</body>
</html>
