    cursor: grabbing;
  }

    will-change: transform;
    transform: translate3d(0,0,0);

function cloneData(x){ return JSON.parse(JSON.stringify(x)); }

function sanitizeImageUrl(value){
  if (!value || typeof value !== 'string') return null;
  const trimmed = value.trim();
  if (!trimmed) return null;
  if (trimmed.startsWith('file://')) return null;
  if (trimmed.startsWith('C:/') || trimmed.startsWith('C:\\')) return null;
  return trimmed;
}

function detectMediaType(url) {
  if (!url) return 'image';
  const lower = url.toLowerCase();
  if (lower.match(/\.(mp4|webm|ogg|mov)(\?|$)/)) return 'video';
  return 'image';
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (event) => resolve(event.target?.result || null);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

      trigger.className = 'upload-trigger';
      trigger.textContent = 'Add from computer';
      trigger.addEventListener('click', () => fileInput.click());
      row.insertBefore(trigger, fileInput);
    }
    document.querySelectorAll('[data-open-file]').forEach((openBtn) => {
      const target = openBtn.dataset.openFile;
      if (target === fileInput.dataset.uploadTarget) {
        openBtn.onclick = () => fileInput.click();
      }
    });
    fileInput.addEventListener('change', async (event) => {
      const file = event.target?.files?.[0];
      if (!file) return;
      try {
        const dataUrl = await readFileAsDataURL(file);
        const targetName = fileInput.dataset.uploadTarget;
        const targetInput = document.querySelector(`[data-image-field="${targetName}"]`);
        if (targetInput) {
          targetInput.value = dataUrl || '';
          targetInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
      } catch (err) {
        console.error('Upload failed', err);
        alert('Could not load this file. Please try another one.');
      }
      fileInput.value = '';
    });
  });
}

function normalizeMedia(media, fallback){
  if (media && typeof media === 'object' && media.url) {
    const clean = sanitizeImageUrl(media.url);
    if (clean) {
      return { 
        type: media.type || detectMediaType(clean), 
        url: clean 
      };
    }
  }
  if (fallback && typeof fallback === 'object' && fallback.url) {
    const clean = sanitizeImageUrl(fallback.url);
    if (clean) return { type: fallback.type || detectMediaType(clean), url: clean };
  }
  return null;
}

function normalizeMagazine(saved){
  const base = cloneData(DEFAULT_MAGAZINE);
  if (!saved || typeof saved !== 'object') return base;
  const mergedCities = (saved.cities && Array.isArray(saved.cities) ? saved.cities : base.cities).map((city, idx) => {
    const fallbackCity = base.cities[idx] || base.cities[0];
    const model = {
      ...(fallbackCity?.model || {}),
      ...(city?.model || {})
    };
    model.media = normalizeMedia(city?.model?.media, fallbackCity?.model?.media);
    const ads = (city?.ads && Array.isArray(city.ads) ? city.ads : fallbackCity?.ads || []).map((ad, adIdx) => {
      const fallbackAd = (fallbackCity?.ads || [])[adIdx] || {};
      return {
        ...fallbackAd,
        ...(ad || {}),
        media: normalizeMedia(ad?.media, fallbackAd?.media)
      };
    });
    return {
      ...(fallbackCity || {}),
      ...(city || {}),
      model,
      ads
    };
  });
  const merged = {
    ...base,
    ...(saved || {}),
    cover: {
      ...base.cover,
      ...(saved.cover || {})
    },
    backCover: {
      ...base.backCover,
      ...(saved.backCover || {})
    },
    cities: mergedCities
  };
  merged.cover.coverPhotoUrl = sanitizeImageUrl(merged.cover.coverPhotoUrl) || base.cover.coverPhotoUrl;
  return merged;
}

/* ========== LOAD FROM JSONBIN ========== */
async function loadMagazine() {
  try {
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      headers: {
        'X-Master-Key': MASTER_KEY
      }
    });
    if (res.ok) {
      const json = await res.json();
      const data = json.record || json;
      const normalized = normalizeMagazine(data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      return normalized;
    }
  } catch (e) {
    console.warn('Could not load from JSONBin, falling back...', e);
  }

  // fallback to localStorage
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return normalizeMagazine(JSON.parse(saved));
  } catch (e) {}

  return cloneData(DEFAULT_MAGAZINE);
}

/* ========== SAVE TO JSONBIN ========== */
async function saveToJSONBin(data) {
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('Failed to save');
    return true;
  } catch (err) {
    console.error(err);
    alert('Could not save to the cloud. Please try again.');
    return false;
  }
}

function resetMagazineContent(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  location.reload();
}

  const cls = 'media-box' + (extraClass ? ' '+extraClass : '');
  if(!media || !media.url){

  }
  if(media.type === 'video'){
    return `<div class="${cls}"><video src="${media.url}" autoplay muted loop playsinline></video></div>`;

  return `<div class="${cls}"><img src="${media.url}" alt=""></div>`;
}

function bindEditor(){
  document.getElementById('saveMagazine').onclick = async () => {
    // Collect data from current tab
    if(activeTab==='cover'){
      document.querySelectorAll('[data-cover]').forEach(el => MAGAZINE.cover[el.dataset.cover] = el.value || null);
      
      const coverUrl = document.querySelector('[data-media-url="cover-photo"]')?.value.trim();
      MAGAZINE.cover.coverPhotoUrl = sanitizeImageUrl(coverUrl);
      
      const featureUrl = document.querySelector('[data-media-url="cover-feature"]')?.value.trim();
      MAGAZINE.cover.featureImageUrl = sanitizeImageUrl(featureUrl);
      
      const story1Url = document.querySelector('[data-media-url="story-one"]')?.value.trim();
      MAGAZINE.cover.articleOneImageUrl = sanitizeImageUrl(story1Url);
      
      const story2Url = document.querySelector('[data-media-url="story-two"]')?.value.trim();
      MAGAZINE.cover.articleTwoImageUrl = sanitizeImageUrl(story2Url);
    } 
    else if(activeTab==='back'){
      document.querySelectorAll('[data-back]').forEach(el => MAGAZINE.backCover[el.dataset.back] = el.value);
    } 
    else if(activeTab.startsWith('city-')){
      const ci = +activeTab.split('-')[1];
      const c = MAGAZINE.cities[ci];
      document.querySelectorAll('[data-key]').forEach(el => c[el.dataset.key] = el.value);
      c.model = c.model || {};
      document.querySelectorAll('[data-model]').forEach(el => c.model[el.dataset.model] = el.value);
      
      const modelUrl = document.querySelector('[data-model-media]')?.value.trim();
      const modelType = document.querySelector(`input[name="model-${ci}-type"]:checked`)?.value || detectMediaType(modelUrl);
      c.model.media = sanitizeImageUrl(modelUrl) ? { type: modelType, url: sanitizeImageUrl(modelUrl) } : null;
      
      document.querySelectorAll('.ad-editor[data-ai]').forEach(adEl => {
        const ai = +adEl.dataset.ai;
        const a = c.ads[ai];
        if(!a) return;
        adEl.querySelectorAll('[data-ad]').forEach(el => a[el.dataset.ad] = el.value);
        const u = adEl.querySelector('[data-ad-media]')?.value.trim();
        const type = adEl.querySelector(`input[name="ad-${ci}-${ai}-type"]:checked`)?.value || detectMediaType(u);
        const clean = sanitizeImageUrl(u);
        a.media = clean ? { type, url: clean } : null;
      });
    }

    // Show saving state
    const btn = document.getElementById('saveMagazine');
    const originalText = btn.textContent;
    btn.textContent = 'SAVING...';
    btn.disabled = true;

    // Save to JSONBin (live)
    const success = await saveToJSONBin(MAGAZINE);
    
    if (success) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(MAGAZINE));
      btn.textContent = 'SAVED ✓';
      setTimeout(() => {
        location.reload();
      }, 800);
    } else {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };

  document.getElementById('closeEditor').onclick = () => editorPanel.classList.remove('open');
  document.querySelectorAll('.remove-ad').forEach(b => b.onclick = () => {
    MAGAZINE.cities[+b.dataset.ci].ads.splice(+b.dataset.ai, 1);
    renderEditor();
    bindEditor();
  });
}

editorToggle.onclick = () => {
  if(isEditorUnlocked){
    editorPanel.classList.add('open');
    renderEditor();
    bindEditor();
    return;
  }
  document.getElementById('passwordModal').classList.add('show');
  setTimeout(() => document.getElementById('passwordInput')?.focus(), 120);
};

let PAGES = [];
let total = 0;
let current = 0;
const bookEl = document.getElementById('book');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageCountEl = document.getElementById('pageCount');

function buildPages() {
  PAGES = [
    {
      id: 'cover',
      cls: 'cover',
      html: () => `
        <div class="top-tag">${MAGAZINE.cover.issueTag}</div>
        <div class="title">${MAGAZINE.cover.mainText}<br>${MAGAZINE.cover.highlight}<span class="hi">.</span></div>
        <div class="sub">${MAGAZINE.cover.subtitle}</div>
        ${mediaBlock(MAGAZINE.cover.coverPhotoUrl ? {type: detectMediaType(MAGAZINE.cover.coverPhotoUrl), url: MAGAZINE.cover.coverPhotoUrl} : null, '[ COVER PHOTO / VIDEO ]', 'cover-photo')}
        <div class="cover-story-grid">
          <div class="cover-story-card">
            <div class="mini-label">Feature</div>
            <h3>${MAGAZINE.cover.featureTitle || 'This month’s local stories'}</h3>
            <p>${MAGAZINE.cover.featureSummary || 'Add a feature summary here.'}</p>
            ${mediaBlock(MAGAZINE.cover.featureImageUrl ? {type: detectMediaType(MAGAZINE.cover.featureImageUrl), url: MAGAZINE.cover.featureImageUrl} : null, '[ FEATURE MEDIA ]', 'story-media')}
          </div>
          <div class="cover-story-card">
            <div class="mini-label">Story 1</div>
            <h3>${MAGAZINE.cover.articleOneTitle || 'City Notes'}</h3>
            <p>${MAGAZINE.cover.articleOneText || 'Add the first article summary here.'}</p>
            ${mediaBlock(MAGAZINE.cover.articleOneImageUrl ? {type: detectMediaType(MAGAZINE.cover.articleOneImageUrl), url: MAGAZINE.cover.articleOneImageUrl} : null, '[ STORY MEDIA ]', 'story-media')}
          </div>
          <div class="cover-story-card">
            <div class="mini-label">Story 2</div>
            <h3>${MAGAZINE.cover.articleTwoTitle || 'Next up'}</h3>
            <p>${MAGAZINE.cover.articleTwoText || 'Add a second article summary here.'}</p>
            ${mediaBlock(MAGAZINE.cover.articleTwoImageUrl ? {type: detectMediaType(MAGAZINE.cover.articleTwoImageUrl), url: MAGAZINE.cover.articleTwoImageUrl} : null, '[ STORY MEDIA ]', 'story-media')}
          </div>
        </div>
        <div class="flip-hint">Tap or swipe to flip →</div>
      `
    },
    ...MAGAZINE.cities.map(cityPage),
    {
      id: 'back',
      cls: 'back-cover',
      html: () => `
        <h2>${MAGAZINE.backCover.heading}</h2>
        <p>${MAGAZINE.backCover.description}</p>
        <div class="cta-box">DM <span class="handle">${MAGAZINE.backCover.handle}</span>${MAGAZINE.backCover.ctaEnd}</div>
      `
    }
  ];
  total = PAGES.length;
}

function renderPageContent(){
  bookEl.innerHTML = '';
  dotsEl.innerHTML = '';
  PAGES.forEach((p, idx) => {
    const pageEl = document.createElement('div');
    pageEl.className = 'page';
    pageEl.id = 'page-' + idx;
    const html = typeof p.html === 'function' ? p.html() : p.html;
    pageEl.innerHTML = `
      <div class="face front ${p.cls}">
        <div class="sheet">
          <div class="sheet-inner">${html}</div>
        </div>
      </div>
      <div class="face back"><div class="mark">Spotlight</div></div>`;
    bookEl.appendChild(pageEl);
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.title = p.id;
    dot.onclick = () => { current = idx; render(); };
    dotsEl.appendChild(dot);
  });
}

function render(){
  PAGES.forEach((p, idx) => {
    const el = document.getElementById('page-' + idx);
    const flipped = idx < current;
    el.classList.toggle('flipped', flipped);
    el.style.zIndex = flipped ? (idx + 1) : (total - idx + 1);
  });
  [...dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  pageCountEl.textContent = `Page ${current + 1} of ${total}`;
}

function nextPage(){ if(current < total - 1){ current++; render(); } }
function prevPage(){ if(current > 0){ current--; render(); } }

function initCustomScrollers() {
  document.querySelectorAll('.sheet').forEach(sheet => {
    if (sheet.dataset.scrollReady) return;
    sheet.dataset.scrollReady = '1';

    const inner = sheet.querySelector('.sheet-inner');
    if (!inner) return;

    let currentY = 0;
    let velocity = 0;
    let lastY = 0;
    let lastTime = 0;
    let isDragging = false;
    let startY = 0;
    let rafId = null;
    let maxScroll = 0;

    function updateMax() {
      maxScroll = Math.max(0, inner.scrollHeight - sheet.clientHeight);
    }

    function setY(y) {
      currentY = Math.max(-maxScroll, Math.min(0, y));
      inner.style.transform = `translate3d(0, ${currentY}px, 0)`;
    }

    function momentum() {
      if (Math.abs(velocity) < 0.2) {
        velocity = 0;
        return;
      }
      velocity *= 0.94;
      setY(currentY + velocity);
      rafId = requestAnimationFrame(momentum);
    }

    function isRealLink(target) {
      const link = target.closest('a[href]');
      if (!link) return false;
      const href = link.getAttribute('href');
      return href && href !== '#' && href.trim() !== '';
    }

    sheet.addEventListener('touchstart', e => {
      if (isRealLink(e.target)) return;
      updateMax();
      if (maxScroll <= 0) return;
      isDragging = true;
      startY = e.touches[0].clientY - currentY;
      lastY = e.touches[0].clientY;
      lastTime = performance.now();
      velocity = 0;
      if (rafId) cancelAnimationFrame(rafId);
    }, { passive: true });

    sheet.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const y = e.touches[0].clientY;
      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      velocity = (y - lastY) / dt * 16;
      lastY = y;
      lastTime = now;
      setY(y - startY);
    }, { passive: true });

    sheet.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      if (Math.abs(velocity) > 0.8) {
        rafId = requestAnimationFrame(momentum);
      }
    }, { passive: true });

    sheet.addEventListener('wheel', e => {
      updateMax();
      if (maxScroll <= 0) return;
      e.preventDefault();
      e.stopPropagation();
      setY(currentY - e.deltaY * 0.9);
    }, { passive: false });

    sheet.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (isRealLink(e.target)) return;
      updateMax();
      if (maxScroll <= 0) return;
      isDragging = true;
      startY = e.clientY - currentY;
      lastY = e.clientY;
      lastTime = performance.now();
      velocity = 0;
      if (rafId) cancelAnimationFrame(rafId);
      sheet.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const y = e.clientY;
      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      velocity = (y - lastY) / dt * 16;
      lastY = y;
      lastTime = now;
      setY(y - startY);
    });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.style.cursor = 'grab';
      if (Math.abs(velocity) > 0.8) {
        rafId = requestAnimationFrame(momentum);
      }
    });
  });
}

let touchStartX = null;
const bookWrap = document.querySelector('.book-wrap');
if (bookWrap) {
  bookWrap.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  bookWrap.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 55) {
      if (dx < -40) nextPage();
      if (dx > 40) prevPage();
    }
    touchStartX = null;
  }, { passive: true });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});

window.addEventListener('load', () => {
  editorToggle.style.display = 'block';
  start();
});
</script>
